name: url-shortner-ci

on:
  push:
    branches:
    - "feature-*"
    - main
    paths:
      - "Url-Shortner/**"
      - ".github/workflows/url_shortner_ci.yml"
      - "pyproject.toml"

  pull_request:
    branches:
      - main
    paths:
      - "Url-Shortner/**"
      - ".github/workflows/url_shortner_ci.yml"
      - "pyproject.toml"

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: pip install -r Url-Shortner/backend/requirements.txt

      - name: Install development dependencies
        run: pip install -r Url-Shortner/backend/requirements-dev.txt

      - name: Run Linter
        run: ruff check Url-Shortner/backend

      - name: Run database migrations
        working-directory: Url-Shortner/backend
        run: alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://test_user:test_password@localhost:5432/test_db

      - name: Run tests
        working-directory: Url-Shortner/backend
        run: python -m pytest
        env:
          DATABASE_URL: postgresql+psycopg://test_user:test_password@localhost:5432/test_db

  publish:
   runs-on: ubuntu-latest
   needs: tests
   if: github.event_name == 'push' && github.ref == 'ref/head/main'

   steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-Buildx-action@v3

    - name: Login to Dockerhub
      uses: docker/login-action@v3
      with:
        username: @{{ secrets.DOCKERHUB_USERNAME }}
        password: @{{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and Push frontend image
      uses: docker/build-push-action@v6
      with:
        context: ./Url-Shortner/frontend
        file: ./Url-Shortner/frontend/Dockerfile
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/url-shortner-frontend:v1

      - name: Build and Push backend image
        uses: docker/build-push-actions@v6
        with:
          context: ./Url-Shortner/backend
          file: ./Url-Shortner/backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/url-shortner-backend:v1
      

