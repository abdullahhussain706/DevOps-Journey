
name: url-shortner-ci

on:
  push:
    branches:
      - "feature-*"
      - main
    paths:
      - "Url-Shortner/**"
      - ".github/workflows/url_shortner_ci.yml"
      - "pyproject.toml"

  pull_request:
    branches:
      - main
    paths:
      - "Url-Shortner/**"
      - ".github/workflows/url_shortner_ci.yml"
      - "pyproject.toml"

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: pip install -r Url-Shortner/backend/requirements.txt

      - name: Install development dependencies
        run: pip install -r Url-Shortner/backend/requirements-dev.txt

      - name: Run Linter
        run: ruff check Url-Shortner/backend

      - name: Run database migrations
        working-directory: Url-Shortner/backend
        run: alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://test_user:test_password@localhost:5432/test_db

      - name: Run tests
        working-directory: Url-Shortner/backend
        run: python -m pytest
        env:
          DATABASE_URL: postgresql+psycopg://test_user:test_password@localhost:5432/test_db

  publish:
    runs-on: ubuntu-latest
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./Url-Shortner/frontend
          file: ./Url-Shortner/frontend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/url-shortner-frontend:v1

      - name: Build and Push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./Url-Shortner/backend
          file: ./Url-Shortner/backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/url-shortner-backend:v1

  deploy:
    name: Deploy and Verify on Azure VM
    runs-on: ubuntu-latest
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Deploy application and run smoke tests
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e

            cd ~/url-shortner-deploy

            echo "Pulling latest frontend and backend images..."
            docker compose pull frontend backend

            echo "Applying database migrations..."
            docker compose run --rm backend alembic upgrade head

            echo "Updating application containers..."
            docker compose up -d --no-deps backend frontend

            echo "Waiting for frontend..."
            for i in $(seq 1 12); do
              if curl -fsS http://localhost:8080/ > /dev/null; then
                break
              fi
              sleep 5
            done

            curl -fsS http://localhost:8080/ > /dev/null

            echo "Testing URL creation API..."
            response=$(curl -fsS -X POST http://localhost:8080/api/urls \
              -H "Content-Type: application/json" \
              -d '{"original_url":"https://example.com"}')

            short_code=$(printf '%s' "$response" | python3 -c \
              'import json,sys; print(json.load(sys.stdin)["short_code"])')

            echo "Testing short URL redirect..."
            status=$(curl -sS -o /dev/null -w "%{http_code}" \
              "http://localhost:8080/$short_code")

            if [ "$status" != "307" ]; then
              echo "Redirect test failed. HTTP status: $status"
              exit 1
            fi

            echo "All deployment checks passed!"
            docker compose ps
