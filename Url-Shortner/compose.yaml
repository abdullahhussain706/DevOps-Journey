services:
  frontend:
    image: url-shortner-frontend:latest
    build:
      context: ./frontend
      
    ports:
      - "8080:80"
    restart:
      unless-stopped

  backend:
    image: url-shortner-backend:latest
    build:
      context: ./backend

    restart:
      unless-stopped

  db:
    image: postgres:18-alpine
    restart:
      always

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    
    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: