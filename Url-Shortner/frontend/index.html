<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>URL Shortener</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <section class="hero">
            <h1>URL Shortener</h1>

            <p>
                Turn long URLs into short, shareable links.
            </p>
        </section>


        <section class="shortener-card">

            <form id="shorten-form">

                <div class="form-group">
                    <label for="original-url">
                        Enter your long URL
                    </label>

                    <input
                        type="url"
                        id="original-url"
                        name="original_url"
                        placeholder="https://example.com/very-long-url"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="custom-alias">
                        Custom alias
                        <span>(optional)</span>
                    </label>

                    <input
                        type="text"
                        id="custom-alias"
                        name="custom_alias"
                        placeholder="my-link"
                    >
                </div>


                <button type="submit">
                    Shorten URL
                </button>

            </form>


            <div id="result" class="result hidden">

                <p>Your shortened URL:</p>

                <div class="short-url-container">

                    <input
                        type="text"
                        id="short-url"
                        readonly
                    >

                    <button type="button" id="copy-button">
                        Copy
                    </button>

                </div>

            </div>


            <div id="error-message" class="error hidden"></div>

        </section>

    </main>


    <script src="script.js"></script>

</body>
</html>
